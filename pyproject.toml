[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-tournament-runner"
version = "0.1.0"
description = "Run No-Limit Hold'em bot matches and tournaments"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
# eval7 must be installed first with --no-build-isolation (see `make install`).
dependencies = ["eval7==0.1.7", "pyyaml>=6", "fastapi>=0.110", "uvicorn[standard]>=0.29", "mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pre-commit>=4", "ruff>=0.17"]

[project.scripts]
poker = "arena.cli:main"

[tool.setuptools]
packages = ["arena", "arena.formats", "arena.server", "engine", "sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 120
# Reference bots are benchmark opponents keyed by code hash: never rewrite them.
extend-exclude = ["bots"]

[tool.ruff.lint]
# Basic checks only: syntax errors, import problems, and pyflakes (undefined
# names, unused imports and variables, and similar mistakes). No style rules.
select = ["E4", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# bots under development often keep values they don't use yet
"my_bots/**" = ["F841"]
